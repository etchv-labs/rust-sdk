[package]
name = "etchv"
version = "1.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Etchv Labs"]
license = "MIT"
description = "Official Etchv client for invisible forensic watermarking of images, PDFs and videos"
readme = "README.md"
homepage = "https://etchv.com/docs"
repository = "https://github.com/etchv-labs/rust-sdk"
documentation = "https://docs.rs/etchv"
keywords = ["watermark", "watermarking", "forensic", "etchv", "api"]
categories = ["api-bindings", "multimedia", "web-programming::http-client"]
include = ["src/**/*.rs", "tests/**/*.rs", "tests/*.json", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
aws-lc-rs = { version = "1.13", default-features = false, features = ["aws-lc-sys"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tiny_http = "0.12"
