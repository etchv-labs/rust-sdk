name: Use Node 26 for jobs and vendor actions
description: Install a verified Node distribution before any JavaScript action runs
runs:
  using: composite
  steps:
    - name: Install Node 26.10.0 and replace runner Node executables
      shell: python {0}
      working-directory: ${{ runner.temp }}
      env:
        ETCHV_NODE_ACTION_PATH: ${{ github.action_path }}
      run: |
        import os, runpy
        runpy.run_path(os.path.join(os.environ['ETCHV_NODE_ACTION_PATH'], 'install.py'), run_name='__main__')
