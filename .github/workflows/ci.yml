name: SDK CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/node26
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/node26
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - run: cargo check --locked --all-targets
